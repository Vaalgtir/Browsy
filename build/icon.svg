<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fb2ff"/>
      <stop offset="0.55" stop-color="#c7b8ff"/>
      <stop offset="1" stop-color="#ffc6b3"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3b2f7a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- Grille d'icône macOS : corps de 824 px centré, coins continus -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>
  <!-- Sidebar : trois lignes d'onglets -->
  <rect x="228" y="300" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="228" y="370" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.55"/>
  <rect x="228" y="440" width="110" height="40" rx="20" fill="#ffffff" fill-opacity="0.55"/>
  <!-- Carte de contenu -->
  <rect x="418" y="250" width="380" height="524" rx="56" fill="#ffffff" filter="url(#shadow)"/>
</svg>
